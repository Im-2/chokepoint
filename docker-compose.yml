# Local FalkorDB. Port 6379 = database, 3000 = FalkorDB Browser UI (http://localhost:3000).
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb-data:
